<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="loops-title">
  <title id="loops-title">Два контура: постоянный поток работы слева и замкнутый контур проверки справа, объединённые стандартом, который возвращает результат обратно в поток</title>
  <style>
    .node rect,
    .node polygon {
      fill: #1A1C1F;
      stroke: #3B3F44;
      stroke-width: 1.5;
    }
    .node rect {
      rx: 6;
      ry: 6;
    }
    .node-key rect {
      fill: #1A1C1F;
      stroke: #D4AF37;
      stroke-width: 2;
    }
    .node text {
      fill: #F5F5F2;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 17px;
    }
    .edge line,
    .edge-line {
      stroke: #D4AF37;
      stroke-width: 1.5;
    }
    .edge-curve {
      fill: none;
      stroke: #D4AF37;
      stroke-width: 1.5;
    }
    .edge-feedback {
      fill: none;
      stroke: #D4AF37;
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
    }
    .edge-label {
      fill: #D4AF37;
      font-family: Consolas, ui-monospace, monospace;
      font-size: 17px;
      text-anchor: middle;
    }
    .zone-band {
      fill: rgba(245, 245, 242, 0.03);
    }
    .zone-edge {
      fill: #D4AF37;
      opacity: 0.55;
    }
    .zone-label {
      fill: #D4AF37;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 22px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4AF37"></path>
    </marker>
  </defs>

  <g class="zones" aria-hidden="true">
    <rect class="zone-band" x="20" y="20" width="420" height="250"></rect>
    <rect class="zone-edge" x="20" y="20" width="3" height="250"></rect>
    <text class="zone-label" x="40" y="48">ПОСТОЯННЫЙ ПОТОК</text>

    <rect class="zone-band" x="600" y="20" width="490" height="400"></rect>
    <rect class="zone-edge" x="600" y="20" width="3" height="400"></rect>
    <text class="zone-label" x="620" y="48">КОНТУР ПРОВЕРКИ</text>
  </g>

  <!-- left stream: four nodes -->
  <g class="node">
    <rect x="40" y="90" width="170" height="64"></rect>
    <text x="125" y="116" text-anchor="middle"><tspan x="125" dy="0">Контент и</tspan><tspan x="125" dy="17">кампании</tspan></text>
  </g>
  <g class="node">
    <rect x="230" y="90" width="170" height="64"></rect>
    <text x="315" y="116" text-anchor="middle"><tspan x="315" dy="0">Дизайн и</tspan><tspan x="315" dy="17">продакшн</tspan></text>
  </g>
  <g class="node">
    <rect x="40" y="174" width="170" height="64"></rect>
    <text x="125" y="200" text-anchor="middle"><tspan x="125" dy="0">Бренд и</tspan><tspan x="125" dy="17">гайды</tspan></text>
  </g>
  <g class="node">
    <rect x="230" y="174" width="170" height="64"></rect>
    <text x="315" y="200" text-anchor="middle"><tspan x="315" dy="0">Типовые</tspan><tspan x="315" dy="17">задачи</tspan></text>
  </g>

  <!-- left stream into the verification loop -->
  <path class="edge-curve" d="M440,206 C500,206 560,270 638,270" marker-end="url(#arrowhead)"></path>
  <!-- Подпись стоит в коридоре между зонами, прямо над своей линией: у края
       правой зоны она задевала золотую вертикаль, а поднятая под заголовок
       левой зоны читалась как второй заголовок, а не как имя связи. -->
  <text class="edge-label" x="520" y="170">проблема или</text>
  <text class="edge-label" x="520" y="192">возможность</text>

  <!-- verification loop: six nodes, clockwise: Сигнал -> Гипотеза -> Артефакт -> Факт -> Доказательство -> Паттерн -> Стандарт -->
  <g class="node">
    <rect x="640" y="245" width="110" height="50"></rect>
    <text x="695" y="275" text-anchor="middle"><tspan x="695">Сигнал</tspan></text>
  </g>
  <g class="node">
    <rect x="710" y="163" width="120" height="50"></rect>
    <text x="770" y="193" text-anchor="middle"><tspan x="770">Гипотеза</tspan></text>
  </g>
  <g class="node">
    <rect x="870" y="163" width="120" height="50"></rect>
    <text x="930" y="193" text-anchor="middle"><tspan x="930">Артефакт</tspan></text>
  </g>
  <g class="node">
    <rect x="955" y="245" width="100" height="50"></rect>
    <text x="1005" y="275" text-anchor="middle"><tspan x="1005">Факт</tspan></text>
  </g>
  <!-- «Доказательство» — самое длинное слово схемы, 14 знаков. При ширине 130
       оно шло переносом «Доказа-/тельство»; узел расширен до 190, чтобы слово
       стояло одной строкой, а петля раздвинута под эту ширину. -->
  <g class="node">
    <rect x="840" y="327" width="190" height="50"></rect>
    <text x="935" y="357" text-anchor="middle"><tspan x="935">Доказательство</tspan></text>
  </g>
  <g class="node">
    <rect x="680" y="327" width="120" height="50"></rect>
    <text x="740" y="357" text-anchor="middle"><tspan x="740">Паттерн</tspan></text>
  </g>

  <g class="loop-edges">
    <path class="edge-curve" d="M712,245 Q710,222 740,215" marker-end="url(#arrowhead)"></path>
    <path class="edge-curve" d="M830,188 Q850,168 868,188" marker-end="url(#arrowhead)"></path>
    <path class="edge-curve" d="M970,213 Q992,222 995,243" marker-end="url(#arrowhead)"></path>
    <path class="edge-curve" d="M995,296 Q992,318 972,325" marker-end="url(#arrowhead)"></path>
    <path class="edge-curve" d="M838,352 Q820,374 802,352" marker-end="url(#arrowhead)"></path>
  </g>

  <!-- short feedback: Факт did not confirm -> back to Гипотеза -->
  <path class="edge-feedback" d="M953,270 Q880,270 830,213" marker-end="url(#arrowhead)"></path>
  <text class="edge-label" x="858" y="302">не подтвердилось</text>

  <!-- seventh node: the standard, between the two parts, below centre -->
  <g class="node node-key">
    <rect x="470" y="460" width="260" height="90"></rect>
    <text x="600" y="511" text-anchor="middle"><tspan x="600">СТАНДАРТ</tspan></text>
  </g>

  <path class="edge-curve" d="M740,377 C740,410 690,425 690,458" marker-end="url(#arrowhead)"></path>

  <path class="edge-feedback" d="M470,505 C300,505 230,400 230,270" marker-end="url(#arrowhead)"></path>
  <text class="edge-label" x="380" y="400">возвращается в работу</text>
</svg>
